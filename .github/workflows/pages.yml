name: Build and deploy GLOBAL11 documentation

on:
  push:
    branches: [main]
    paths:
      - "mkdocs.yml"
      - "README.md"
      - "docs/**"
      - "scripts/**"
      - "data-dictionary/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: pip install mkdocs-material
      - name: Validate DMRS documentation
        run: python scripts/validate_dmrs_docs.py
      - name: Build documentation
        run: mkdocs build --site-dir _site
      - name: Include data dictionary
        run: |
          mkdir -p _site/data-dictionary
          cp -R data-dictionary/. _site/data-dictionary/
          cp README.md _site/README.md
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
