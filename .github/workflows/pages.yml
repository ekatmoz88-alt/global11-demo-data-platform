name: Deploy GLOBAL11 documentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "README.md"
      - "docs/**"
      - "data-dictionary/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble public documentation site
        run: |
          mkdir -p _site/docs _site/data-dictionary
          cp index.html README.md _site/
          cp -R docs/. _site/docs/
          cp -R data-dictionary/. _site/data-dictionary/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
